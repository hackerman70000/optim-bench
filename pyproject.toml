[project]
name = "optim-bench"
version = "0.1.0"
description = "PyTorch optimizer benchmarking framework"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "pytorch-optimizer",
    "matplotlib",
    "pandas",
    "pyyaml",
    "typer[all]",
    "loguru",
    "dacite",
    "numpy",
]

[project.scripts]
optim-bench = "optim_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optim_bench"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
